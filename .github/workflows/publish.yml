name: Publish Extension

on:
  push:
    branches:
      - publish

permissions:
  contents: write

jobs:
  publish:
    name: Build & Publish to Marketplaces
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Read Package Info
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "VSIX_NAME=device-screenshot-$VERSION.vsix" >> $GITHUB_ENV

      - name: Package VSIX
        run: npx @vscode/vsce package --allow-missing-repository

      - name: Publish to VS Code Marketplace
        run: npx @vscode/vsce publish --packagePath "$VSIX_NAME" -p "${{ secrets.VSCE_PAT }}"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX Registry (Antigravity IDE & Open-source IDEs)
        run: npx ovsx publish "$VSIX_NAME" -p "${{ secrets.OVSX_PAT }}"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Create GitHub Release with VSIX
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: Release v${{ steps.pkg.outputs.version }}
          body_path: CHANGELOG.md
          files: ${{ env.VSIX_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
